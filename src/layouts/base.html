<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#0B0D12">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="{{root}}site.webmanifest">

  <meta property="og:type" content="{{og_type}}">
  <meta property="og:locale" content="{{t.og_locale}}">
  <meta property="og:site_name" content="{{t.name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="{{root}}assets/css/main.css">
{{jsonld}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">{{t.skip}}</a>
{{> header}}
{{content}}
{{> footer}}
  <a class="wa-float" id="waFloat" href="{{home}}#contact" aria-label="{{t.wa_label}}">

  </a>

  <script src="{{root}}assets/js/config.js" defer></script>
  <script src="{{root}}assets/js/tracking.js" defer></script>
  <script src="{{root}}assets/js/main.js" defer></script>
</body>
</html>
