<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="author" content="{{t.name}}">
  <meta name="theme-color" content="#0A0B0E">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{canonical}}">
{{verify_meta}}
{{alternates}}
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">

  <meta property="og:type" content="{{og_type}}">
  <meta property="og:locale" content="{{t.og_locale}}">
  <meta property="og:site_name" content="{{t.name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{t.name}} — {{t.tagline}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site_url}}/assets/img/og-image.jpg">

  <link rel="preload" href="{{root}}assets/fonts/readex-pro-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/readex-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/css/main.css">
{{jsonld}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">{{t.skip}}</a>
{{> header}}
{{content}}
{{> footer}}

  <a class="wa-float" id="waFloat" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener" aria-label="{{t.wa_label}}">{{> i-chat}}</a>

  <!-- مساعد المحادثة -->
  <button class="ai-launch" id="aiLaunch" type="button" data-ai-open aria-controls="aiPanel" aria-expanded="false">
    <span class="ai-launch-ic" aria-hidden="true">{{> i-spark}}</span>
    <span class="ai-launch-txt">{{t.ai_open}}</span>
  </button>
  <section class="ai-panel" id="aiPanel" role="dialog" aria-modal="false" aria-labelledby="aiTitle" hidden>
    <header class="ai-head">
      <img src="{{root}}assets/img/ibrahim-320.webp" alt="" width="40" height="40">
      <div><strong id="aiTitle"></strong><small id="aiStatus"></small></div>
      <button type="button" class="ai-close" id="aiClose">✕</button>
    </header>
    <div class="ai-msgs" id="aiMsgs" aria-live="polite"></div>
    <div class="ai-chips" id="aiChips"></div>
    <form class="ai-form" id="aiForm" autocomplete="off">
      <input id="aiInput" type="text" maxlength="800" aria-label="{{t.ai_open}}">
      <button type="submit" id="aiSend"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg></button>
    </form>
    <p class="ai-disclaimer" id="aiDisclaimer"></p>
  </section>

  <div class="mobile-cta" id="mobileCta">
    <a class="btn btn-primary" href="{{home}}#contact">{{t.mobile_cta}}</a>
    <button class="mobile-cta-ic" type="button" data-ai-open aria-label="{{t.ai_open}}">{{> i-spark}}</button>
    <a class="mobile-cta-ic" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener" aria-label="{{t.wa_label}}">{{> i-chat}}</a>
  </div>

  <script src="{{root}}assets/js/config.js" defer></script>
  <script src="{{root}}assets/js/tracking.js" defer></script>
  <script src="{{root}}assets/js/main.js" defer></script>
  <script src="{{root}}assets/js/assistant.js" defer></script>
</body>
</html>
