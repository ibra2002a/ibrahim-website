  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="logo" href="{{home_link}}" aria-label="{{t.name}}">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M8 21.5 13.5 15l4 4L24 10.5" stroke="#0A0B0E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="logo-text">{{t.name}}<small>{{t.role}}</small></span>
      </a>

      <nav class="nav" id="nav" aria-label="{{t.nav_label}}">
        <div class="nav-links">
          <a href="{{home}}#about">{{t.nav_about}}</a>
          <a href="{{home}}#services">{{t.nav_services}}</a>
          <a href="{{work_href}}">{{t.nav_work}}</a>
          <a href="{{home}}#pricing">{{t.nav_pricing}}</a>
          <a href="{{blog_url}}">{{t.nav_blog}}</a>
        </div>
        <div class="lang-switch" role="group" aria-label="{{t.lang_label}}">{{lang_switch}}</div>
        <a class="btn btn-primary btn-sm nav-cta" href="{{home}}#contact">{{t.cta}}</a>
      </nav>

      <button class="nav-toggle" id="navToggle" type="button" aria-label="{{t.menu_open}}" data-label-open="{{t.menu_open}}" data-label-close="{{t.menu_close}}" aria-expanded="false" aria-controls="nav">
        <span></span><span></span>
      </button>
    </div>
  </header>
