  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-brand">
          <a class="logo" href="{{home_link}}" aria-label="{{t.name}}">
            <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M8 21.5 13.5 15l4 4L24 10.5" stroke="#0A0B0E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="logo-text">{{t.name}}<small dir="ltr">{{t.tagline}}</small></span>
          </a>
          <div class="social">{{social_icons}}</div>
        </div>
        <nav class="footer-nav" aria-label="{{t.footer_label}}">
          <a href="{{home_link}}">{{t.nav_home}}</a>
          <a href="{{home}}#about">{{t.nav_about}}</a>
          <a href="{{home}}#services">{{t.nav_services}}</a>
          <a href="{{work_href}}">{{t.nav_work}}</a>
          <a href="{{blog_url}}">{{t.nav_blog}}</a>
          <a href="{{home}}#contact">{{t.nav_contact}}</a>
        </nav>
        {{footer_services}}
      </div>
      <div class="footer-bottom">
        <p class="copy" dir="ltr">© <span id="year">2026</span> {{t.copyright}}</p>
        <div class="lang-switch lang-switch-sm" role="group" aria-label="{{t.lang_label}}">{{lang_switch}}</div>
      </div>
    </div>
  </footer>
